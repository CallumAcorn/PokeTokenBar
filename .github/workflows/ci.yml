name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level; jobs widen only what they need.
# Without this block the repository default applies, which on many repos is
# read/write for every scope — a compromised action step would inherit it.
permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      # Third-party and first-party actions alike are pinned to a commit SHA.
      # A tag is a movable pointer: whoever can push tags to the action's repo
      # can change what runs here. The `# vN` comment tracks what the SHA was.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The job never pushes, so leaving the token in .git/config only
          # widens what a later step could pick up.
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate
        run: ./scripts/test-gate.sh

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action annotates the pull request when it finds something.
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
